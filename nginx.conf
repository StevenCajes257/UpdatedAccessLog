server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.firebaseio.com https://*.googleapis.com https://www.google.com https://www.gstatic.com https://*.firebasedatabase.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebaseapp.com wss://*.firebaseio.com https://www.google.com https://www.gstatic.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; frame-src 'self' https://www.google.com https://*.firebasedatabase.app;" always;
    # Block access to hidden files (like .env, .git)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Handle React routing (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (optional)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to any files that might contain sensitive data
    location ~* (\.env|\.git|\.log|config\.js|firebaseConfig\.js) {
        deny all;
        return 404;
    }
}