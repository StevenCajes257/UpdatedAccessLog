version: '3.8'

services:
  # 1. The Database Container
  db:
    image: mysql:8.0
    container_name: access_log_db
    restart: always
    environment:
      MYSQL_DATABASE: access_log
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. The Laravel Backend Container
  backend:
    build:
      context: ./backend # Assumes your Laravel code is in a 'backend' folder
      dockerfile: Dockerfile
    container_name: access_log_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: access_log
      DB_USERNAME: root
      DB_PASSWORD: root

  # 3. The React/Vite Frontend Container
  frontend:
    build:
      context: ./frontend # Assumes your React code is in a 'frontend' folder
      dockerfile: Dockerfile
    container_name: access_log_dashboard
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data: